[package]
name = "planetdraw-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
glam = { version = "0.29.2", features = ["serde"] }
thiserror = "2.0.11"
vengine-rs = { git = "ssh://git@github.com/adrian-afl/vengine-rs.git", rev = "18064fb4dd13e65e02496142c43e9ff484b875b1" }
dashu-float = "0.4.3"
ash = { version = "0.38.0", features = ["linked"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
brotli = "7.0.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
winit = { version = "0.30.7", features = ["rwh_06"] }
gilrs = "0.11.0"
