[package]
name = "planetdraw-rs"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "packages/celestial_renderer",
    "packages/common_util",
    "packages/core",
    "packages/ecs",
    "packages/game_stages",
    "packages/input",
    "packages/math",
    "packages/planet_generator/library",
    "packages/planet_generator/binary",
    "packages/real_physics_engine",
    "packages/renderer_common",
    "packages/ui_renderer",
    "packages/universe_simulation",
]

[workspace.dependencies]
vengine-rs = { git = "ssh://git@github.com/adrian-afl/vengine-rs.git", rev = "db912468135ee6428c224102ee4b3483490b5950" }
winit = { version = "0.30.7", features = ["rwh_06", "serde"] }
dashu-float = { version = "0.4.3" }
glam = { version = "0.29.2", features = ["serde"] }
ash = { version = "0.38.0", features = ["loaded"] }
rayon = "1.10.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
regex = "1.11.1"
gilrs = { version = "0.11.0", features = ["serde-serialize"] }
brotli = "7.0.0"
clap = { version = "4.5.23", features = ["derive"] }
image = "0.25.5"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
rand_xoshiro = "0.6.0"
thiserror = "2.0.11"
rapier3d-f64 = { version = "0.23.0", features = ["simd-stable"] }
fontdue = "0.9.2"
embedded-graphics = "0.8.1"

celestial_renderer = { path = "packages/celestial_renderer" }
common_util = { path = "packages/common_util" }
core = { path = "packages/core" }
ecs = { path = "packages/ecs" }
game_stages = { path = "packages/game_stages" }
input = { path = "packages/input" }
math = { path = "packages/math" }
planet_generator_library = { path = "packages/planet_generator/library" }
real_physics_engine = { path = "packages/real_physics_engine" }
renderer_common = { path = "packages/renderer_common" }
ui_renderer = { path = "packages/ui_renderer" }
universe_simulation = { path = "packages/universe_simulation" }

[dependencies]

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
glam = { workspace = true, features = ["serde"] }
vengine-rs = { workspace = true }
winit = { workspace = true, features = ["rwh_06", "serde"] }
game_stages = { path = "packages/game_stages" }
core = { path = "packages/core" }
common_util = { path = "packages/common_util" }
clap = { workspace = true }

