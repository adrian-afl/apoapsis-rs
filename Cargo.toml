vengine-rs = { git = "ssh://git@github.com/adrian-afl/vengine-rs.git", rev = "d2d87b90c026d4af9f7952780bfccc619dfd96b6" }
dashu-float = "0.4.3"
ash = { version = "0.38.0", features = ["linked"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
brotli = "7.0.0"