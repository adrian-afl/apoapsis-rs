[package]
name = "planetdraw-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
glam = { version = "0.29.2", features = ["serde"] }
thiserror = "2.0.11"
vengine-rs = { git = "ssh://git@github.com/adrian-afl/vengine-rs.git", rev = "6b4adced090f381a304f1f98049db655784ce3ee" }
dashu-float = { version = "0.4.3", features = ["serde"] }
ash = { version = "0.38.0", features = ["linked"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
brotli = "7.0.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
winit = { version = "0.30.7", features = ["rwh_06", "serde"] }
gilrs = "0.11.0"
rapier3d-f64 = { version = "0.23.0", features = ["simd-stable"] }
regex = "1.11.1"
strum = "0.26.3"
strum_macros = "0.26.4"
#tokio = { version = "1", features = ["full"] }
