[package]
name = "core"
version = "0.1.0"
edition = "2021"

[dependencies]
vengine-rs = { git = "ssh://git@github.com/adrian-afl/vengine-rs.git", rev = "db4300037180528357a4417a5e68a002dcf68f23" }
math = { path = "../math" }
celestial_renderer = { path = "../celestial_renderer" }
ui_renderer = { path = "../ui_renderer" }
real_physics_engine = { path = "../real_physics_engine" }
renderer_common = { path = "../renderer_common" }
ecs = { path = "../ecs" }
input = { path = "../input" }
universe_simulation = { path = "../universe_simulation" }
winit = { version = "0.30.7", features = ["rwh_06", "serde"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
glam = { version = "0.29.2" }
dashu-float = { version = "0.4.3" }